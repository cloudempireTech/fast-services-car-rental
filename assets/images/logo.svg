<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae29c" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8018" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18202c" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="235" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Sleek Luxury Car Silhouette Arc -->
  <path d="M 140 235 C 190 190, 310 190, 360 235 L 380 255 L 120 255 Z" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M 180 230 C 220 205, 280 205, 320 230 Z" fill="#0a0d14" />
  <!-- Wheels -->
  <circle cx="170" cy="260" r="24" fill="#0a0d14" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="330" cy="260" r="24" fill="#0a0d14" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Brand Typography -->
  <text x="250" y="340" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="700" fill="url(#goldGrad)" letter-spacing="5">FAST SERVICES</text>
  <text x="250" y="375" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#fae29c" letter-spacing="4">LUXURY &amp; EVENT CAR RENTAL</text>
  <text x="250" y="405" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="rgba(250, 226, 156, 0.8)" letter-spacing="3">PARK STREET &#8226; KOLKATA</text>
</svg>
